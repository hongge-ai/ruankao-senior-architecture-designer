<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1129 694" width="1129" height="694" font-family="Noto Sans CJK SC, sans-serif" fill="#193743"><title>表 16-1 5种存储管理比较</title><desc>根据教材印刷页560复原。四列五种管理方式，各条优缺点按行列还原；“可变分区”由本行前文补足。</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto-start-reverse"><path d="M0 0L6 3L0 6Z" fill="#426477"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="3" y="3" width="98" height="38" fill="#e0edf0" stroke="#496778"/><text x="12" y="28.5" font-size="16">存储管理</text><rect x="101" y="3" width="402" height="38" fill="#e0edf0" stroke="#496778"/><text x="110" y="28.5" font-size="16">功能描述</text><rect x="503" y="3" width="319" height="38" fill="#e0edf0" stroke="#496778"/><text x="512" y="28.5" font-size="16">优点</text><rect x="822" y="3" width="304" height="38" fill="#e0edf0" stroke="#496778"/><text x="831" y="28.5" font-size="16">缺点</text><rect x="3" y="41" width="98" height="153" fill="white" stroke="#496778"/><text x="12" y="124.0" font-size="16">分区存储</text><rect x="101" y="41" width="402" height="153" fill="white" stroke="#496778"/><text x="110" y="66.5" font-size="16">分区存储分为静态分区、可变分区、可重定位分区</text><text x="110" y="89.5" font-size="16">。其主要做法是将内存空间分成几个区域，在加载</text><text x="110" y="112.5" font-size="16">程序时，选择一个当前闲置且容量够大的分区进行</text><text x="110" y="135.5" font-size="16">加载。而可变分区是将内存空间看作一个整体，在</text><text x="110" y="158.5" font-size="16">加载程序时，就在该片空间里面分出一个大小刚刚</text><text x="110" y="181.5" font-size="16">满足程序所需的空间</text><rect x="503" y="41" width="319" height="153" fill="white" stroke="#496778"/><text x="512" y="112.5" font-size="16">● 管理简单</text><text x="512" y="135.5" font-size="16">● 采用静态地址翻译</text><rect x="822" y="41" width="304" height="153" fill="white" stroke="#496778"/><text x="831" y="101.0" font-size="16">● 空间浪费问题：碎片存在</text><text x="831" y="124.0" font-size="16">● 程序受限问题：增长存在，空间增</text><text x="831" y="147.0" font-size="16">长效率低和增长存在天花板限制</text><rect x="3" y="194" width="98" height="107" fill="white" stroke="#496778"/><text x="12" y="254.0" font-size="16">分页存储</text><rect x="101" y="194" width="402" height="107" fill="white" stroke="#496778"/><text x="110" y="219.5" font-size="16">核心是将虚拟内存空间和物理内存空间皆划分成大</text><text x="110" y="242.5" font-size="16">小相同的页面，并以页面作为内存空间的最小分配</text><text x="110" y="265.5" font-size="16">单位。一个程序的一个页面可以放在任意一个物理</text><text x="110" y="288.5" font-size="16">页面里</text><rect x="503" y="194" width="319" height="107" fill="white" stroke="#496778"/><text x="512" y="231.0" font-size="16">● 不会产生外部碎片</text><text x="512" y="254.0" font-size="16">● 可解决进程空间的增长</text><text x="512" y="277.0" font-size="16">● 页面可共享</text><rect x="822" y="194" width="304" height="107" fill="white" stroke="#496778"/><text x="831" y="231.0" font-size="16">● 页表很大，占用大量内存空间</text><text x="831" y="254.0" font-size="16">● 程序全部装入内存，需要有相应的</text><text x="831" y="277.0" font-size="16">硬件支持</text><rect x="3" y="301" width="98" height="199" fill="white" stroke="#496778"/><text x="12" y="407.0" font-size="16">分段存储</text><rect x="101" y="301" width="402" height="199" fill="white" stroke="#496778"/><text x="110" y="372.5" font-size="16">核心是将一个程序按照逻辑单元分成多个程序段，</text><text x="110" y="395.5" font-size="16">每一个段使用自己单独的虚拟地址空间。如编译器</text><text x="110" y="418.5" font-size="16">，可以将一个程序分成5个虚拟空间，即符号表、代</text><text x="110" y="441.5" font-size="16">码段、常数段、词法数和调用栈</text><rect x="503" y="301" width="319" height="199" fill="white" stroke="#496778"/><text x="512" y="326.5" font-size="16">● 每个逻辑单元可单独占一个虚拟地址</text><text x="512" y="349.5" font-size="16">空间，使得空间大为增长</text><text x="512" y="372.5" font-size="16">● 段是按逻辑关系而分，共享起来就非</text><text x="512" y="395.5" font-size="16">常方便</text><text x="512" y="418.5" font-size="16">● 对于空间稀疏程度而言，分段管理将</text><text x="512" y="441.5" font-size="16">节省大量的空间</text><text x="512" y="464.5" font-size="16">● 可以分别编写和编译，可以对不同类</text><text x="512" y="487.5" font-size="16">型的段采取不同的保护</text><rect x="822" y="301" width="304" height="199" fill="white" stroke="#496778"/><text x="831" y="395.5" font-size="16">● 存在外部碎片和一个段必须全部加</text><text x="831" y="418.5" font-size="16">载到内存</text><rect x="3" y="500" width="98" height="84" fill="white" stroke="#496778"/><text x="12" y="548.5" font-size="16">段页存储</text><rect x="101" y="500" width="402" height="84" fill="white" stroke="#496778"/><text x="110" y="537.0" font-size="16">段页式管理就是将程序分为多个逻辑段，在每个段</text><text x="110" y="560.0" font-size="16">里面又进行分页，即将分段和分页组合起来使用</text><rect x="503" y="500" width="319" height="84" fill="white" stroke="#496778"/><text x="512" y="525.5" font-size="16">● 便于程序模块化设计</text><text x="512" y="548.5" font-size="16">● 减少存储空间的浪费</text><text x="512" y="571.5" font-size="16">● 可实现程序的动态链接</text><rect x="822" y="500" width="304" height="84" fill="white" stroke="#496778"/><text x="831" y="525.5" font-size="16">● 管理的复杂度和开销增加</text><text x="831" y="548.5" font-size="16">● 需要的硬件及占有内存增加，执行</text><text x="831" y="571.5" font-size="16">速度下降</text><rect x="3" y="584" width="98" height="107" fill="white" stroke="#496778"/><text x="12" y="644.0" font-size="16">虚拟存储</text><rect x="101" y="584" width="402" height="107" fill="white" stroke="#496778"/><text x="110" y="609.5" font-size="16">虚拟存储技术就是利用实际内存空间和相对大的外</text><text x="110" y="632.5" font-size="16">部储存器存储空间相结合构成一个远远大于实际内</text><text x="110" y="655.5" font-size="16">存空间的虚拟存储空间，程序就运行在这个虚拟存</text><text x="110" y="678.5" font-size="16">储空间中</text><rect x="503" y="584" width="319" height="107" fill="white" stroke="#496778"/><text x="512" y="609.5" font-size="16">● 内存利用率高</text><text x="512" y="632.5" font-size="16">● 程序不受现有内存空间的限制</text><text x="512" y="655.5" font-size="16">● 可提高多道程序度</text><text x="512" y="678.5" font-size="16">● 良好的经济性</text><rect x="822" y="584" width="304" height="107" fill="white" stroke="#496778"/><text x="831" y="621.0" font-size="16">● 需要硬件支持</text><text x="831" y="644.0" font-size="16">● 存在带宽瓶颈</text><text x="831" y="667.0" font-size="16">● 系统扩展性差</text></svg>
