<style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#153744;text-anchor:middle;dominant-baseline:central}.line{stroke:#3f7586;stroke-width:1.5;fill:none}</style>
<rect x="15.0" y="80.0" width="115.0" height="45.0" fill="white" stroke="#7598a1" stroke-width="1.4"/>
<text x="72.5" y="102.5" font-size="16">发起者</text>
<rect x="250.0" y="80.0" width="111.0" height="45.0" fill="white" stroke="#7598a1" stroke-width="1.4"/>
<text x="305.5" y="102.5" font-size="16">AEF</text>
<rect x="514.0" y="80.0" width="112.0" height="45.0" fill="white" stroke="#7598a1" stroke-width="1.4"/>
<text x="570.0" y="102.5" font-size="16">目标</text>
