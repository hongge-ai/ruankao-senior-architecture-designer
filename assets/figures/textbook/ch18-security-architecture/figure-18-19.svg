<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 249" role="img" aria-labelledby="title desc">
<title id="title">图 18-19 基本访问控制功能示意图</title><desc id="desc">发起者向AEF递交访问请求，AEF向ADF请求判决并依据返回判决向目标呈递请求。</desc>
