    rect, polygon {fill:white;stroke:#456b7a;stroke-width:1.7}
    line {stroke:#456b7a;stroke-width:1.7}
    text {font:18px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#192d38;text-anchor:middle;paint-order:stroke;stroke:white;stroke-width:4;stroke-linejoin:round}
  </style>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#456b7a"/></marker></defs>
  <g stroke-dasharray="6 4"><rect x="67" y="42" width="764" height="387"/></g>
  <text x="118" y="28">Istio Mesh</text>
  <rect x="154" y="61" width="576" height="144"/>
  <text x="227" y="134">Data plane</text>
