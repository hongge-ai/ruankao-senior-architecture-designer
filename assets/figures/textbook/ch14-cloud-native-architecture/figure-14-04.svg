<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 902 445" role="img" aria-labelledby="title desc">
  <title id="title">图 14-4 服务网格的典型架构</title>
  <desc id="desc">两个服务各与其代理双向通信。入口流量进入左代理，再经右代理到出口；控制平面向两个代理分发发现、配置和证书。Istiod 内含 Pilot、Citadel、Galley。</desc>
