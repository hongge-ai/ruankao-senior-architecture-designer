  <rect x="542" y="80" width="122" height="39"/><text x="603.0" y="105.5">Service B</text>
  <rect x="254" y="155" width="122" height="42"/><text x="315.0" y="182.0">Proxy</text>
  <rect x="542" y="155" width="122" height="42"/><text x="603.0" y="182.0">Proxy</text>
  <line x1="315" y1="120" x2="315" y2="154" marker-end="url(#tip)" marker-start="url(#tip)"/>
  <line x1="603" y1="120" x2="603" y2="154" marker-end="url(#tip)" marker-start="url(#tip)"/>
  <line x1="7" y1="178" x2="253" y2="178" marker-end="url(#tip)"/>
  <line x1="377" y1="178" x2="541" y2="178" marker-end="url(#tip)"/>
  <line x1="665" y1="178" x2="892" y2="178" marker-end="url(#tip)"/>
  <text x="116" y="168">Ingress Traffic</text>
  <text x="460" y="167">Mesh traffic</text>
  <text x="779" y="166">Egress Traffic</text>
