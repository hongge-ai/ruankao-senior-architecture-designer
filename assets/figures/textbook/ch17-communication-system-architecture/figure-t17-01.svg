<svg xmlns="http://www.w3.org/2000/svg" width="1090" height="563" viewBox="0 0 1090 563" role="img" aria-labelledby="title"><title id="title">四种组网模型对比</title>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 8 4 0 8Z" fill="#477786"/></marker></defs>
<rect width="1090" height="563" fill="white"/>
<rect x="7" y="7" width="172" height="44" fill="#cbe8ef" stroke="#477786" stroke-width="1.5"/>
<text x="93.0" y="34.78" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="17" fill="#173c48">拓扑</text>
<rect x="179" y="7" width="411" height="44" fill="#cbe8ef" stroke="#477786" stroke-width="1.5"/>
<text x="384.5" y="34.78" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="17" fill="#173c48">优点</text>
<rect x="590" y="7" width="492" height="44" fill="#cbe8ef" stroke="#477786" stroke-width="1.5"/>
<text x="836.0" y="34.78" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="17" fill="#173c48">缺点</text>
<rect x="7" y="51" width="172" height="103" fill="#eff8fa" stroke="#477786" stroke-width="1.5"/>
<text x="17" y="96.0" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#173c48">模型一</text>
<text x="17" y="119.0" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#173c48">（倒 U 形）</text>
<rect x="179" y="51" width="411" height="103" fill="white" stroke="#477786" stroke-width="1.5"/>
<text x="189" y="84.5" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#173c48">(1) 无环路，不启用 STP，网络管理简单。</text>
<text x="189" y="107.5" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#173c48">(2) VLAN 可以跨汇聚层交换机，用户设备二层扩展灵</text>
<text x="189" y="130.5" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#173c48">活。</text>
<rect x="590" y="51" width="492" height="103" fill="white" stroke="#477786" stroke-width="1.5"/>
<text x="600" y="96.0" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#173c48">汇聚交换机故障会造成其同侧接入交换机所连用户设备不可达，</text>
<text x="600" y="119.0" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#173c48">无法实现高可用接入。</text>
<rect x="7" y="154" width="172" height="131" fill="#eff8fa" stroke="#477786" stroke-width="1.5"/>
<text x="17" y="213.0" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#173c48">模型二</text>
<text x="17" y="236.0" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#173c48">（U 形）</text>
<rect x="179" y="154" width="411" height="131" fill="white" stroke="#477786" stroke-width="1.5"/>
<text x="189" y="213.0" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#173c48">(1) 无环路，不启用 STP，网络管理简单。</text>
<text x="189" y="236.0" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#173c48">(2) 接入交换机与汇聚交换机之间有冗余链路保护。</text>
<rect x="590" y="154" width="492" height="131" fill="white" stroke="#477786" stroke-width="1.5"/>
<text x="600" y="201.5" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#173c48">(1) VLAN 不能跨汇聚交换机，用户设备部署不灵活。</text>
<text x="600" y="224.5" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#173c48">(2) 接入交换机间链路故障时，VRRP 心跳报文无法传递，网络处</text>
<text x="600" y="247.5" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#173c48">于不稳定状态。</text>
<rect x="7" y="285" width="172" height="152" fill="#eff8fa" stroke="#477786" stroke-width="1.5"/>
<text x="17" y="354.5" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#173c48">模型三</text>
<text x="17" y="377.5" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#173c48">（矩形）</text>
<rect x="179" y="285" width="411" height="152" fill="white" stroke="#477786" stroke-width="1.5"/>
<text x="189" y="354.5" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#173c48">(1) 接入交换机与汇聚交换机之间有冗余链路保护。</text>
<text x="189" y="377.5" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#173c48">(2) VLAN 可以跨汇聚层交换机。</text>
<rect x="590" y="285" width="492" height="152" fill="white" stroke="#477786" stroke-width="1.5"/>
<text x="600" y="343.0" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#173c48">(1) 存在环路，启用 STP。</text>
<text x="600" y="366.0" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#173c48">(2) 当接入交换机上行链路故障时，所有流量将从另一侧交换机</text>
<text x="600" y="389.0" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#173c48">上行，网络收敛比变小，网络易拥塞，降低了网络可用性。</text>
<rect x="7" y="437" width="172" height="117" fill="#eff8fa" stroke="#477786" stroke-width="1.5"/>
<text x="17" y="489.0" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#173c48">模型四</text>
<text x="17" y="512.0" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#173c48">（三角形）</text>
<rect x="179" y="437" width="411" height="117" fill="white" stroke="#477786" stroke-width="1.5"/>
<text x="189" y="477.5" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#173c48">(1) 接入交换机与汇聚交换机之间有冗余链路，冗余</text>
<text x="189" y="500.5" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#173c48">路径保护。</text>
<text x="189" y="523.5" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#173c48">(2) VLAN 可以跨汇聚层交换机，用户设备部署灵活。</text>
<rect x="590" y="437" width="492" height="117" fill="white" stroke="#477786" stroke-width="1.5"/>
<text x="600" y="500.5" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#173c48">存在环路，启用 STP，生成树计算较矩形拓扑复杂。</text>
</svg>
