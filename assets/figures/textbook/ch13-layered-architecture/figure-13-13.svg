  <line x1="80" y1="407" x2="343" y2="378" marker-end="url(#a)"/>
  <text x="205" y="370.0">GetMiddleName()</text>
  <line x1="343" y1="412" x2="80" y2="441" marker-end="url(#a)"/>
  <line x1="80" y1="501" x2="343" y2="472" marker-end="url(#a)"/>
