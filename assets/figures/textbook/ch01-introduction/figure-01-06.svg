<svg xmlns="http://www.w3.org/2000/svg" width="780" height="500" viewBox="0 0 780 500" font-family="sans-serif">
  <title>图 1-6 云架构</title>
  <desc>复原自《系统架构设计师教程（第2版）》印刷页 12（物理页 21）插图。三个 Processing Unit 水平相连并各自与 Virtualized Middleware（Messaging Grid、Data Grid、Processing Grid、Deployment Manager）双向连接。电子页的三个同类节点统一标作 Processing Unit；右侧省略号表示更多处理单元；三个处理单元均含三块相连的流程、数据存储与网格及底部模块。</desc>
