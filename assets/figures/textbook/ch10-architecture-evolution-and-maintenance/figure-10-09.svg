<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 950" font-family="Liberation Serif, SimSun, 'Noto Serif CJK SC', 'WenQuanYi Zen Hei', 'Droid Sans Fallback', serif" font-size="19">
  <title>图 10-9 演化过程未知时的架构演化评估过程示意图</title>
  <desc>复原自《系统架构设计师教程（第2版）》印刷页354（物理页363）。左列：演化前架构（文档形状）→架构度量→演化前架构度量结果（平行四边形）；右列同构。两个度量结果斜线汇入下方「比较」大框内的椭圆「架构质量属性变化」；椭圆左下经「推测」连线到椭圆「架构演化操作集合」，右下经「是否符合」连线到椭圆「架构演化驱动因素」；两下椭圆之间水平虚线，旁标「分析」。</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <g fill="none" stroke="#000" stroke-width="1.3">
    <!-- 左列 -->
    <path d="M80,40 L360,40 L360,128 Q330,116 295,128 Q260,140 225,128 Q190,116 155,128 Q120,140 80,128 Z"/>
    <line x1="220" y1="130" x2="220" y2="188" marker-end="url(#ar)"/>
    <rect x="80" y="190" width="280" height="76"/>
    <line x1="220" y1="266" x2="220" y2="323" marker-end="url(#ar)"/>
    <polygon points="110,325 390,325 330,425 50,425"/>
    <!-- 右列 -->
    <path d="M560,40 L840,40 L840,128 Q810,116 775,128 Q740,140 705,128 Q670,116 635,128 Q600,140 560,128 Z"/>
    <line x1="700" y1="130" x2="700" y2="188" marker-end="url(#ar)"/>
    <rect x="560" y="190" width="280" height="76"/>
    <line x1="700" y1="266" x2="700" y2="323" marker-end="url(#ar)"/>
    <polygon points="590,325 870,325 810,425 530,425"/>
    <!-- 比较大框 -->
    <rect x="80" y="470" width="760" height="460"/>
    <!-- 汇入斜线 -->
    <line x1="220" y1="425" x2="392" y2="562" marker-end="url(#ar)"/>
    <line x1="700" y1="425" x2="468" y2="562" marker-end="url(#ar)"/>
    <!-- 椭圆 -->
    <ellipse cx="430" cy="645" rx="172" ry="82"/>
    <ellipse cx="230" cy="852" rx="155" ry="72"/>
    <ellipse cx="612" cy="852" rx="155" ry="72"/>
    <!-- 推测 / 是否符合 连线 -->
    <line x1="342" y1="708" x2="268" y2="778" marker-end="url(#ar)"/>
    <line x1="520" y1="708" x2="594" y2="778" marker-end="url(#ar)"/>
    <!-- 分析虚线 -->
    <line x1="385" y1="852" x2="457" y2="852" stroke-dasharray="6 5" stroke-width="1"/>
  </g>
  <g fill="#000" stroke="none" text-anchor="middle">
    <text x="220" y="92">演化前架构</text>
    <text x="220" y="236">架构度量</text>
    <text x="225" y="368">演化前架构</text>
    <text x="210" y="396">度量结果</text>
    <text x="700" y="92">演化后架构</text>
    <text x="700" y="236">架构度量</text>
    <text x="705" y="368">演化后架构</text>
    <text x="690" y="396">度量结果</text>
    <text x="460" y="465">比较</text>
    <text x="430" y="637">架构质量</text>
    <text x="430" y="665">属性变化</text>
    <text x="316" y="748">推测</text>
    <text x="600" y="748">是否符合</text>
    <text x="230" y="844">架构演化</text>
    <text x="230" y="872">操作集合</text>
    <text x="420" y="836">分析</text>
    <text x="612" y="844">架构演化</text>
    <text x="612" y="872">驱动因素</text>
  </g>
</svg>
