<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 1200" font-family="Liberation Serif, SimSun, 'Noto Serif CJK SC', 'WenQuanYi Zen Hei', 'Droid Sans Fallback', serif" font-size="18">
  <title>图 10-14 第五阶段网站架构</title>
  <desc>复原自《系统架构设计师教程（第2版）》印刷页357（物理页366）。左侧圆角框「负载均衡调度服务器」（文字分两行），其右缘分出三条箭头指向三层错位应用服务器框（「应用服务器n」「应用服务器2」「应用服务器1」）左边缘。最前的「应用服务器1」框内含平行四边形「应用程序」、其下方波浪纸形「本地缓存」、右下方圆角「数据访问模块」（文字分两行）；「应用程序」向下有箭头指向「本地缓存」，其右侧顶点分出三条箭头：一条指向右上方三层错位缓存服务器框（最前框内为「远程分布式缓存」）的前框下边缘、一条指向「文件服务器」左缘（内含错位多张纸「文件」）、一条指向「数据访问模块」上边缘。「数据访问模块」左下角分出两条箭头：标「写操作」者指向「数据库服务器（主）」左缘，标「读操作」者指向「数据库服务器（从）」上边缘；「数据库服务器（主）」的圆柱下方另有一条曲线箭头标「主/从复制」指向「数据库服务器（从）」的圆柱右侧。原图中第三个缓存服务器框文字为「分布式缓存服务器」（无末尾数字），照录。两个数据库服务器框内均为圆柱「数据库」。</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
