<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" font-family="Liberation Serif, SimSun, 'Noto Serif CJK SC', 'WenQuanYi Zen Hei', 'Droid Sans Fallback', serif" font-size="16">
  <title>图 10-1 对象演化的自动机表示</title>
  <desc>复原自《系统架构设计师教程（第2版）》印刷页332（物理页341）。四个子图呈2×2排列：上排之间为水平箭头AO（向右），下排之间为水平箭头DO（向左）。每个子图：顶部矩形A0向下分叉无箭头直线连接状态圆圈，圆圈间水平消息箭头，圆圈向下无箭头直线连接底部空矩形，矩形下方标注对象名。左上（演化前）：s1→s2，s1下A0，s2下A1、A2。右上（AO后）：s1→s2→s_new，s1下A0，s2下A1、A2，s_new下A_new。左下：同左上。右下（DO前）：s1→s_del→s2，s1下A0，s_del下A_del，s2下A1、A2。</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <g fill="none" stroke="#000" stroke-width="1.3">
    <!-- 左上子图 -->
    <rect x="180" y="30" width="140" height="40"/>
    <line x1="220" y1="70" x2="167" y2="133"/>
    <line x1="280" y1="70" x2="333" y2="133"/>
    <circle cx="165" cy="160" r="26"/>
    <circle cx="335" cy="160" r="26"/>
    <line x1="191" y1="160" x2="309" y2="160" marker-end="url(#ar)"/>
    <line x1="165" y1="186" x2="165" y2="240"/>
    <line x1="335" y1="186" x2="325" y2="240"/>
    <line x1="335" y1="186" x2="435" y2="240"/>
    <rect x="115" y="240" width="100" height="40"/>
    <rect x="275" y="240" width="100" height="40"/>
    <rect x="385" y="240" width="100" height="40"/>
    <!-- 右上子图 -->
    <rect x="735" y="30" width="130" height="40"/>
    <line x1="775" y1="70" x2="683" y2="135"/>
    <line x1="800" y1="70" x2="800" y2="136"/>
    <line x1="825" y1="70" x2="925" y2="133"/>
    <circle cx="680" cy="160" r="24"/>
    <circle cx="800" cy="160" r="24"/>
    <circle cx="930" cy="160" r="30"/>
    <line x1="704" y1="160" x2="776" y2="160" marker-end="url(#ar)"/>
    <line x1="824" y1="160" x2="900" y2="160" marker-end="url(#ar)"/>
    <line x1="680" y1="184" x2="680" y2="240"/>
    <line x1="800" y1="184" x2="780" y2="240"/>
    <line x1="800" y1="184" x2="880" y2="240"/>
    <line x1="930" y1="190" x2="990" y2="240"/>
    <rect x="634" y="240" width="92" height="40"/>
    <rect x="734" y="240" width="92" height="40"/>
    <rect x="834" y="240" width="92" height="40"/>
    <rect x="944" y="240" width="92" height="40"/>
    <!-- AO 演化箭头 -->
    <line x1="505" y1="160" x2="615" y2="160" marker-end="url(#ar)"/>
    <!-- 左下子图 -->
    <rect x="180" y="350" width="140" height="40"/>
    <line x1="220" y1="390" x2="167" y2="453"/>
    <line x1="280" y1="390" x2="333" y2="453"/>
    <circle cx="165" cy="480" r="26"/>
    <circle cx="335" cy="480" r="26"/>
    <line x1="191" y1="480" x2="309" y2="480" marker-end="url(#ar)"/>
    <line x1="165" y1="506" x2="165" y2="560"/>
    <line x1="335" y1="506" x2="325" y2="560"/>
    <line x1="335" y1="506" x2="435" y2="560"/>
    <rect x="115" y="560" width="100" height="40"/>
    <rect x="275" y="560" width="100" height="40"/>
    <rect x="385" y="560" width="100" height="40"/>
    <!-- 右下子图 -->
    <rect x="735" y="350" width="130" height="40"/>
    <line x1="775" y1="390" x2="683" y2="455"/>
    <line x1="800" y1="390" x2="800" y2="450"/>
    <line x1="825" y1="390" x2="917" y2="455"/>
    <circle cx="680" cy="480" r="24"/>
    <circle cx="800" cy="480" r="30"/>
    <circle cx="920" cy="480" r="24"/>
    <line x1="704" y1="480" x2="770" y2="480" marker-end="url(#ar)"/>
    <line x1="830" y1="480" x2="896" y2="480" marker-end="url(#ar)"/>
    <line x1="680" y1="504" x2="680" y2="560"/>
    <line x1="800" y1="510" x2="800" y2="560"/>
    <line x1="920" y1="504" x2="905" y2="560"/>
    <line x1="920" y1="504" x2="1015" y2="560"/>
    <rect x="634" y="560" width="92" height="40"/>
    <rect x="750" y="560" width="100" height="40"/>
    <rect x="859" y="560" width="92" height="40"/>
    <rect x="969" y="560" width="92" height="40"/>
    <!-- DO 演化箭头（向左） -->
    <line x1="615" y1="480" x2="505" y2="480" marker-end="url(#ar)"/>
  </g>
  <g fill="#000" stroke="none" text-anchor="middle">
    <text x="250" y="56" font-style="italic">A<tspan dy="4" font-size="11">0</tspan></text>
    <text x="165" y="166" font-style="italic">s1</text>
    <text x="335" y="166" font-style="italic">s2</text>
    <text x="165" y="308" font-style="italic">A<tspan dy="4" font-size="11">0</tspan></text>
    <text x="325" y="308" font-style="italic">A<tspan dy="4" font-size="11">1</tspan></text>
    <text x="435" y="308" font-style="italic">A<tspan dy="4" font-size="11">2</tspan></text>
    <text x="560" y="146" font-style="italic">AO</text>
    <text x="800" y="56" font-style="italic">A<tspan dy="4" font-size="11">0</tspan></text>
    <text x="680" y="166" font-style="italic">s1</text>
    <text x="800" y="166" font-style="italic">s2</text>
    <text x="930" y="166">s_new</text>
    <text x="680" y="308" font-style="italic">A<tspan dy="4" font-size="11">0</tspan></text>
    <text x="780" y="308" font-style="italic">A<tspan dy="4" font-size="11">1</tspan></text>
    <text x="880" y="308" font-style="italic">A<tspan dy="4" font-size="11">2</tspan></text>
    <text x="990" y="308">A_new</text>
    <text x="250" y="376" font-style="italic">A<tspan dy="4" font-size="11">0</tspan></text>
    <text x="165" y="486" font-style="italic">s1</text>
    <text x="335" y="486" font-style="italic">s2</text>
    <text x="165" y="628" font-style="italic">A<tspan dy="4" font-size="11">0</tspan></text>
    <text x="325" y="628" font-style="italic">A<tspan dy="4" font-size="11">1</tspan></text>
    <text x="435" y="628" font-style="italic">A<tspan dy="4" font-size="11">2</tspan></text>
    <text x="800" y="376" font-style="italic">A<tspan dy="4" font-size="11">0</tspan></text>
    <text x="680" y="486" font-style="italic">s1</text>
    <text x="800" y="486">s_del</text>
    <text x="920" y="486" font-style="italic">s2</text>
    <text x="680" y="628" font-style="italic">A<tspan dy="4" font-size="11">0</tspan></text>
    <text x="800" y="628">A_del</text>
    <text x="905" y="628" font-style="italic">A<tspan dy="4" font-size="11">1</tspan></text>
    <text x="1015" y="628" font-style="italic">A<tspan dy="4" font-size="11">2</tspan></text>
    <text x="560" y="512" font-style="italic">DO</text>
  </g>
</svg>
