<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 740" font-family="Liberation Serif, SimSun, 'Noto Serif CJK SC', 'WenQuanYi Zen Hei', 'Droid Sans Fallback', serif" font-size="19">
  <title>图 10-16 第七阶段网站架构</title>
  <desc>复原自《系统架构设计师教程（第2版）》印刷页359（物理页368）。图体与图题同页，无跨页拼接。结构：左侧 CDN服务器1、反向代理服务器1、负载均衡调度服务器1 三组圆角框各3层堆叠；负载均衡调度服务器1 以3支箭头指向中部应用服务器簇的3层框（应用服务器n/应用服务器2/应用服务器1）。应用服务器1 框内含平行四边形「应用程序」、圆角框「统一数据访问模块」、波浪底文件框「本地缓存」；「应用程序」以箭头指向「本地缓存」和「统一数据访问模块」。右侧三组各3层堆叠的圆角框：「分布式缓存服务器r/2/1」（前框内波浪底文件框「远程分布式缓存」，文字一行）、「分布式文件服务器n/2/1」（前框内文件纸页堆叠3层，前页「文件」）、「分布式数据库服务器n/2/1」（前框内「数据库」圆柱）。「统一数据访问模块」右侧发出3支箭头，分别指向分布式缓存簇底边、分布式文件簇左边、分布式数据库簇顶边。原书此图首个缓存标签末字印作「r」（非「n」），照录。原图无「写操作」「读操作」标注，未补。</desc>
