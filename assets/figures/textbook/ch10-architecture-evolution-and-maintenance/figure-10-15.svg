<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" font-family="Liberation Serif, SimSun, 'Noto Serif CJK SC', 'WenQuanYi Zen Hei', 'Droid Sans Fallback', serif" font-size="19">
  <title>图 10-15 第六阶段网站架构</title>
  <desc>复原自《系统架构设计师教程（第2版）》印刷页358（物理页367）。图体与图题同页，无跨页拼接。结构：左侧 CDN服务器1、反向代理服务器1、负载均衡调度服务器1 三组圆角框堆叠（每组3层，仅前层有文字）；负载均衡调度服务器1 以3支箭头分别指向中间应用服务器簇的3层框（应用服务器n/应用服务器2/应用服务器1）。应用服务器1 框内含平行四边形「应用程序」、圆角框「数据访问模块」、波浪底文件框「本地缓存」；「应用程序」有箭头指向「本地缓存」「数据访问模块」、右上「远程分布式缓存」（分布式缓存服务器n/2/1 三层堆叠的前框内）、右侧「文件服务器」（内文件纸页堆叠3层，前页「文件」）。「数据访问模块」分别以「写操作」「读操作」两支箭头指向「数据库服务器(主)」「数据库服务器(从)」，二者各含一个「数据库」圆柱，另有从主库到从库的曲线箭头（复制方向）。原书此图 CDN 标签印作「C D N服务器1」（字母间有间隙），照录。原书未画连线的部位留空，无推测补画。</desc>
