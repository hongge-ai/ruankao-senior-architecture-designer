<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 820" font-family="Liberation Serif, SimSun, 'Noto Serif CJK SC', 'WenQuanYi Zen Hei', 'Droid Sans Fallback', serif" font-size="19">
  <title>图 10-18 第九阶段网站架构</title>
  <desc>复原自《系统架构设计师教程（第2版）》印刷页361（物理页370）。图体与图题同页，无跨页拼接。结构：左侧 CDN服务器1、反向代理服务器1、负载均衡调度服务器1 各3层堆叠；上部「B应用服务器1」「消息队列服务器1」各3层堆叠。负载均衡调度服务器1 共发6支箭头：3支向上指向 B应用服务器1 的3层框左边，3支指向中部 A应用服务器簇的3层框（A 应用服务器n/A 应用服务器2/A应用服务器1）。B应用服务器1 前框右边以箭头指向消息队列服务器1 簇左边；「应用程序」平行四边形右缘（位于「统一数据访问模块」左侧）以竖直箭头向上，指向消息队列服务器1 前框底边。A应用服务器1 框内含平行四边形「应用程序」、圆角框「统一数据访问模块」、波浪底文件框「本地缓存」；「应用程序」以箭头指向「本地缓存」与「统一数据访问模块」。右侧「分布式缓存服务器n/2/1」「分布式文件服务器n/2/1」「分布式数据库服务器n/2/1」及下方「搜索引擎服务器1」「NoSQL服务器1」，各3层堆叠；「统一数据访问模块」发出5支箭头分别指向缓存簇底边、文件簇左边、数据库簇顶边、搜索引擎顶边、NoSQL顶边。图内文字间距按原图照录：A 应用服务器n、A 应用服务器2 的 A 后有空格，A应用服务器1 无空格。原图无「写操作」「读操作」标注，未补。</desc>
