<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 820" font-family="Liberation Serif, SimSun, 'Noto Serif CJK SC', 'WenQuanYi Zen Hei', 'Droid Sans Fallback', serif" font-size="19">
  <title>图 10-19 第十阶段网站架构</title>
  <desc>复原自《系统架构设计师教程（第2版）》印刷页362（物理页371）。图体与图题同页，无跨页拼接。结构：左侧 CDN服务器1、反向代理服务器（原图此标签无「1」）、负载均衡调度服务器1 各3层堆叠。负载均衡调度服务器1 共发6支箭头：3支向上指向 B应用服务器1 的3层框左边，3支指向 A 应用服务器1 的3层框左边。中部偏上「B应用服务器1」前框右边发3支箭头，分别指向右侧「分布式服务」簇3层框顶边的右端；B应用服务器1 下方「消息队列服务器1」3层堆叠；「A 应用服务器1」簇上方以箭头指向消息队列服务器1 前框底边。「分布式服务」簇（标签为「分布式服务 ii服务器1」「分布式服务1服务器2.」「分布式服务 i 服务器1」，其中末行末尾句点、各行空格按原图照录）前框内含平行四边形「应用程序」、圆角框「统一数据（换行）访问模块)」、波浪底文件框「本地缓存」；「应用程序」以箭头指向「本地缓存」与「访问模块)」。右侧「分布式缓存服务器n/2/1」「分布式文件服务器n/2/1」「分布式数据库服务器n/2/1」及下方「搜索引擎服务器1」「NoSQL服务器1」各3层堆叠；「统一数据访问模块)」发出5支箭头分别指向缓存簇底边、文件簇左边、数据库簇顶边、搜索引擎顶边、NoSQL顶边。原图无「写操作」「读操作」标注，未补。</desc>
