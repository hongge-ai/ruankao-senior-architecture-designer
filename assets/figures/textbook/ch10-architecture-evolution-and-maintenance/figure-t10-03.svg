<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" font-family="Liberation Serif, SimSun, 'Noto Serif CJK SC', 'WenQuanYi Zen Hei', 'Droid Sans Fallback', serif" font-size="17">
  <title>表 10-3 Web 读写程序组件图解析数据</title>
  <desc>复原自《系统架构设计师教程（第2版）》印刷页364-365（物理页373-374）。原书表格跨页：第一段（物理页373）为指标表头 L/talalE/totalN（talalE 为印面怪字，原书如此）及指标值 1/19/13，其下为 S/E/X/R/W 列名与 5 个组件行（sub2、sub1、RemoteDB、RSApplication、RSInterface）；第二段（物理页374）顶部标「（续表）」并重复指标表头 L/talalE/totalN，其下为 8 个组件行（RemoteApplication、RemoteInterface、WebApplication、WebInterface、LocalDB、ClientApplication、MainInterface、User），原书第二段不重复 S/E/X/R/W 列名。指标表头 L、talalE、totalN 各为合并格：L 对 S 列，talalE 横跨 E、X 两列，totalN 横跨 R、W 两列；S/E/X/R/W 列边界自其列名行起向下贯通，不穿过指标合并格。</desc>
