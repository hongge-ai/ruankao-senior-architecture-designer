<text x="20" y="129.5" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="40" y="129.5" text-anchor="start" font-size="18" fill="#15232c">描述基线业务架构。</text>
<text x="20" y="158.5" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="40" y="158.5" text-anchor="start" font-size="18" fill="#15232c">开发目标业务架构。</text>
<text x="20" y="187.5" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="40" y="187.5" text-anchor="start" font-size="18" fill="#15232c">执行以上二者间的差距分析。</text>
<text x="20" y="216.5" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="40" y="216.5" text-anchor="start" font-size="18" fill="#15232c">选择和开发相关的架构视角，通过这些视角架构师可以阐述业务架构是如何</text>
