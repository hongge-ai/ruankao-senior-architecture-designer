<text x="736" y="85.0" text-anchor="start" font-size="18" fill="#15232c">选择参考模型、视角和工具。</text>
<text x="716" y="114.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="736" y="114.0" text-anchor="start" font-size="18" fill="#15232c">开发基线业务架构描述。</text>
