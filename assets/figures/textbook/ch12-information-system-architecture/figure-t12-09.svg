<text x="706" y="897.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="726" y="897.0" text-anchor="start" font-size="18" fill="#15232c">实施治理模型。</text>
<text x="706" y="926.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="726" y="926.0" text-anchor="start" font-size="18" fill="#15232c">从经验教训中产生的变更请求。</text>
