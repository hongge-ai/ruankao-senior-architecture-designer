<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1296 1259" role="img" aria-labelledby="title desc">
<title id="title">表 12-9 迁移规划阶段活动的详细说明</title>
<desc id="desc">入库教材 PDF 物理 435–436，合并跨页续表。两列两组，目标对应步骤，输入对应输出，保留项目从属。</desc>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#15232c">
<rect x="4" y="6" width="1288" height="49" fill="#edf4f8" stroke="none"/>
<text x="347.0" y="38" text-anchor="middle" font-size="21" font-weight="bold" fill="#15232c">目标</text>
<text x="991.0" y="38" text-anchor="middle" font-size="21" font-weight="bold" fill="#15232c">步骤</text>
<line x1="4" y1="6" x2="1292" y2="6" stroke="#697883" stroke-width="1.5"/>
<text x="20" y="87.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="40" y="87.0" text-anchor="start" font-size="18" fill="#15232c">确保实施和迁移规划与企业中正在使用的各种管理框架相协调。</text>
<text x="20" y="116.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="40" y="116.0" text-anchor="start" font-size="18" fill="#15232c">通过分配业务价值和执行业务成本分析，划分所有工作包、项目和构建块</text>
<text x="40" y="143.0" text-anchor="start" font-size="18" fill="#15232c">的优先级。</text>
<text x="20" y="172.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="40" y="172.0" text-anchor="start" font-size="18" fill="#15232c">最终确定架构愿景和架构定义文档，使其与共同商定的实施方法一致。</text>
<text x="20" y="201.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="40" y="201.0" text-anchor="start" font-size="18" fill="#15232c">与相关干系人一起确认在机会和解决方案阶段中定义的过渡架构。</text>
<text x="20" y="230.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="40" y="230.0" text-anchor="start" font-size="18" fill="#15232c">创建、演进并监控详细的实施和迁移规划，提供实现过渡架构所需的各种</text>
<text x="40" y="257.0" text-anchor="start" font-size="18" fill="#15232c">资源。</text>
<text x="706" y="85.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="726" y="85.0" text-anchor="start" font-size="18" fill="#15232c">确定管理框架与实施和迁移规划之间的相互作用。</text>
<text x="706" y="114.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="726" y="114.0" text-anchor="start" font-size="18" fill="#15232c">为每个项目指定业务价值。</text>
<text x="706" y="143.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="726" y="143.0" text-anchor="start" font-size="18" fill="#15232c">估算资源需求、项目时间和交付工具。</text>
<text x="706" y="172.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="726" y="172.0" text-anchor="start" font-size="18" fill="#15232c">通过绩效评估和风险验证，确定迁移项目的优先级。</text>
<text x="706" y="201.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="726" y="201.0" text-anchor="start" font-size="18" fill="#15232c">确定过渡架构的增量内容并更新架构定义文档。</text>
<text x="706" y="230.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="726" y="230.0" text-anchor="start" font-size="18" fill="#15232c">生成架构实现路线图(有时间标识)和迁移计划。</text>
<text x="706" y="259.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="726" y="259.0" text-anchor="start" font-size="18" fill="#15232c">创建架构演进循环并记录收到的经验教训。</text>
<line x1="4" y1="55" x2="1292" y2="55" stroke="#697883" stroke-width="1.5"/>
<rect x="4" y="296" width="1288" height="49" fill="#edf4f8" stroke="none"/>
<text x="347.0" y="328" text-anchor="middle" font-size="21" font-weight="bold" fill="#15232c">输入</text>
<text x="991.0" y="328" text-anchor="middle" font-size="21" font-weight="bold" fill="#15232c">输出</text>
<line x1="4" y1="296" x2="1292" y2="296" stroke="#697883" stroke-width="1.5"/>
<text x="20" y="375.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="40" y="375.0" text-anchor="start" font-size="18" fill="#15232c">架构工作要求书；</text>
<text x="20" y="404.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="40" y="404.0" text-anchor="start" font-size="18" fill="#15232c">能力评估（企业架构成熟度概况和转型准备报告）；</text>
<text x="20" y="433.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="40" y="433.0" text-anchor="start" font-size="18" fill="#15232c">沟通计划；</text>
<text x="20" y="462.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="40" y="462.0" text-anchor="start" font-size="18" fill="#15232c">企业架构的组织模型；</text>
<text x="20" y="491.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="40" y="491.0" text-anchor="start" font-size="18" fill="#15232c">治理模型和框架。</text>
<text x="47" y="520.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="67" y="520.0" text-anchor="start" font-size="18" fill="#15232c">企业架构管理框架。</text>
<text x="47" y="549.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="67" y="549.0" text-anchor="start" font-size="18" fill="#15232c">能力管理框架。</text>
<text x="47" y="578.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="67" y="578.0" text-anchor="start" font-size="18" fill="#15232c">投资组合管理框架。</text>
<text x="47" y="607.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="67" y="607.0" text-anchor="start" font-size="18" fill="#15232c">项目管理框架。</text>
<text x="47" y="636.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="67" y="636.0" text-anchor="start" font-size="18" fill="#15232c">运营管理框架。</text>
<text x="20" y="665.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="40" y="665.0" text-anchor="start" font-size="18" fill="#15232c">定制的架构框架</text>
<text x="20" y="694.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="40" y="694.0" text-anchor="start" font-size="18" fill="#15232c">架构工作说明</text>
<text x="20" y="723.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="40" y="723.0" text-anchor="start" font-size="18" fill="#15232c">架构愿景</text>
<text x="20" y="752.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="40" y="752.0" text-anchor="start" font-size="18" fill="#15232c">架构资源库</text>
<text x="20" y="781.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="40" y="781.0" text-anchor="start" font-size="18" fill="#15232c">架构定义文档草稿：</text>
<text x="47" y="810.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="67" y="810.0" text-anchor="start" font-size="18" fill="#15232c">迁移规划策略</text>
<text x="47" y="839.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="67" y="839.0" text-anchor="start" font-size="18" fill="#15232c">影响分析（项目列表和章程）</text>
<text x="20" y="868.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="40" y="868.0" text-anchor="start" font-size="18" fill="#15232c">架构需求说明书草稿：</text>
<text x="47" y="897.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="67" y="897.0" text-anchor="start" font-size="18" fill="#15232c">差距分析结果（业务、数据、应用和技术架构）</text>
<text x="47" y="926.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
