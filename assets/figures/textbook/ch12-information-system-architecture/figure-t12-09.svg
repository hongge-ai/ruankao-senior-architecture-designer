<text x="47" y="955.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="67" y="955.0" text-anchor="start" font-size="18" fill="#15232c">信息服务管理一体化要求</text>
<text x="20" y="984.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="40" y="984.0" text-anchor="start" font-size="18" fill="#15232c">现存业务程序和项目的变更请求。</text>
<text x="20" y="1013.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="40" y="1013.0" text-anchor="start" font-size="18" fill="#15232c">经过确认和验证的架构路线图。</text>
<text x="20" y="1042.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="40" y="1042.0" text-anchor="start" font-size="18" fill="#15232c">过渡架构 1.0 版。</text>
<text x="47" y="1071.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="67" y="1071.0" text-anchor="start" font-size="18" fill="#15232c">确定的关于差距、解决方案和依赖性的评估。</text>
<text x="47" y="1100.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="67" y="1100.0" text-anchor="start" font-size="18" fill="#15232c">风险注册表 1.0 版本。</text>
<text x="47" y="1129.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="67" y="1129.0" text-anchor="start" font-size="18" fill="#15232c">影响分析(项目列表)。</text>
<text x="47" y="1158.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="67" y="1158.0" text-anchor="start" font-size="18" fill="#15232c">依赖性分析报告。</text>
<text x="47" y="1187.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="67" y="1187.0" text-anchor="start" font-size="18" fill="#15232c">实施因素评估和推导矩阵。</text>
<text x="20" y="1216.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="40" y="1216.0" text-anchor="start" font-size="18" fill="#15232c">实现和迁移计划 0.1 版。</text>
<text x="706" y="665.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="726" y="665.0" text-anchor="start" font-size="18" fill="#15232c">实施和迁移计划 1.0 版。</text>
<text x="706" y="694.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="726" y="694.0" text-anchor="start" font-size="18" fill="#15232c">定稿的架构定义文档。</text>
<text x="706" y="723.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="726" y="723.0" text-anchor="start" font-size="18" fill="#15232c">定稿的架构需求说明书。</text>
<text x="706" y="752.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="726" y="752.0" text-anchor="start" font-size="18" fill="#15232c">定稿的架构路线图。</text>
<text x="706" y="781.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="726" y="781.0" text-anchor="start" font-size="18" fill="#15232c">定稿的过渡架构。</text>
<text x="706" y="810.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="726" y="810.0" text-anchor="start" font-size="18" fill="#15232c">可重用的架构构件块。</text>
<text x="706" y="839.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="726" y="839.0" text-anchor="start" font-size="18" fill="#15232c">架构工作要求书(各实施项目，如果有的话)。</text>
<text x="706" y="868.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
