    line { stroke: #416573; stroke-width: 2; }
    text { font: 22px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #16272e; text-anchor: middle; }
  </style>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" style="fill:#416573;stroke:none"/></marker></defs>
  <rect x="18" y="15" width="128" height="78" rx="12"/>
