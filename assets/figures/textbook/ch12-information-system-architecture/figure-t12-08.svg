<text x="20" y="159.5" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="40" y="159.5" text-anchor="start" font-size="18" fill="#15232c">重新审查业务目标和业务能力，合并从阶段B到阶段D的差距</text>
<text x="40" y="186.5" text-anchor="start" font-size="18" fill="#15232c">分析，确定主要工作包并分组。</text>
<text x="20" y="215.5" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="40" y="215.5" text-anchor="start" font-size="18" fill="#15232c">重新审查并确认企业承受变化的能力。</text>
<text x="20" y="244.5" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="40" y="244.5" text-anchor="start" font-size="18" fill="#15232c">获得一系列过渡架构，它们可以通过对各种机会的开发利用</text>
<text x="40" y="271.5" text-anchor="start" font-size="18" fill="#15232c">，来为各构件块的实现提供持续的业务价值。</text>
<text x="20" y="300.5" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="40" y="300.5" text-anchor="start" font-size="18" fill="#15232c">产生概要性的实施与迁移策略，并取得共识。</text>
<text x="591" y="85.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="611" y="85.0" text-anchor="start" font-size="18" fill="#15232c">确定关键的公司变更属性。</text>
<text x="591" y="114.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="611" y="114.0" text-anchor="start" font-size="18" fill="#15232c">确定项目实施的业务约束。</text>
<text x="591" y="143.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="611" y="143.0" text-anchor="start" font-size="18" fill="#15232c">审查并合并从阶段B到阶段D的差距分析结果。</text>
<text x="591" y="172.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="611" y="172.0" text-anchor="start" font-size="18" fill="#15232c">从功能的角度审查信息需求。</text>
<text x="591" y="201.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="611" y="201.0" text-anchor="start" font-size="18" fill="#15232c">确定并加强交互需求。</text>
<text x="591" y="230.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="611" y="230.0" text-anchor="start" font-size="18" fill="#15232c">改善并验证依赖关系。</text>
<text x="591" y="259.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="611" y="259.0" text-anchor="start" font-size="18" fill="#15232c">确认业务转型的准备情况和风险。</text>
<text x="591" y="288.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="611" y="288.0" text-anchor="start" font-size="18" fill="#15232c">制定高层次的实施和迁移策略。</text>
<text x="591" y="317.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="611" y="317.0" text-anchor="start" font-size="18" fill="#15232c">识别主要的工作包并进行分组。</text>
<text x="591" y="346.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="611" y="346.0" text-anchor="start" font-size="18" fill="#15232c">确定过渡架构。</text>
<text x="591" y="375.0" text-anchor="start" font-size="14" fill="#15232c">●</text>
<text x="611" y="375.0" text-anchor="start" font-size="18" fill="#15232c">创建项目投资组合和项目章程，同时对架构进行更新。</text>
